# Production / staging stack:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spanfloors
      POSTGRES_USER: spanfloors
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spanfloors -d spanfloors"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://spanfloors:${POSTGRES_PASSWORD}@db:5432/spanfloors
    volumes:
      # uploaded + imported media (persists across deploys)
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
      BLOG_DOMAIN: ${BLOG_DOMAIN:-blog.invalid}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Background jobs: retry leads → Twenty every 5 minutes; nightly database backup (14 days kept).
  jobs:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env.production}
    volumes:
      - ./backups:/backups
      - ./deploy/jobs.sh:/jobs.sh:ro
    entrypoint: ["sh", "/jobs.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
